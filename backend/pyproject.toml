[project]
name = "nutrilens-backend"
version = "0.1.0"
description = "NutriLens FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "email-validator>=2.0",              # required by Pydantic EmailStr (auth schemas)
  "pydantic-settings>=2.0",
  "psycopg[binary]>=3.1",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "bcrypt==4.0.1",                     # passlib 1.7.4 breaks on bcrypt>=4.1 (removed __about__)
  "httpx",
  "python-multipart",
  "torch>=2.2",
  "torchvision",
  "opencv-python-headless>=4.9",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# UP042: keep the `(str, enum.Enum)` style the schema design (02 §3) specifies.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses these as argument defaults (B008).
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
